# Publishes the site to Cloudflare Workers (static assets) on every push to main.
# Needs the repository secret CLOUDFLARE_API_TOKEN. Without it this does nothing.

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check for the Cloudflare token
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set yet, so nothing was deployed."; echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Collect the public files (pages, assets, sitemap) into dist/
        if: steps.creds.outputs.ok == 'true'
        run: |
          rsync -a --exclude '.git*' --exclude 'data/' --exclude 'docs/' --exclude 'tools/' --exclude 'dist/' \
                --exclude '*.py' --exclude '__pycache__/' --exclude 'README.md' --exclude 'wrangler.jsonc' ./ dist/
          echo "Files to publish: $(find dist -type f | wc -l)"

      - name: Deploy to Cloudflare
        if: steps.creds.outputs.ok == 'true'
        run: npx --yes wrangler@4 deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"

      - name: Check the published site
        if: steps.creds.outputs.ok == 'true'
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          for p in / /cities/seattle/ /counties/king/ /washington-zip-codes/; do
            echo "$url$p -> HTTP $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url$p")"
          done
